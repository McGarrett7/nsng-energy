[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nsng-energy"
version = "0.1.0"
description = "Reconstruction of the NSNG-Energy dryer experiments"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "torch>=2.3,<3",
    "matplotlib>=3.8,<4",
]

[project.scripts]
nsng-energy = "nsng_energy.__main__:main"

[tool.setuptools.packages.find]
include = ["nsng_energy*"]
